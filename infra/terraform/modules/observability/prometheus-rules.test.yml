rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  - name: all-burn-rate-alerts
    interval: 1m

    input_series:
      # Availability:
      # 98 successful + 2 failed requests/minute
      # 2% error ratio / 0.1% budget = 20x burn
      - series: 'opspilot_http_requests_total{job="opspilot-staging-api",route="/health",status_code="200"}'
        values: '0+98x400'

      - series: 'opspilot_http_requests_total{job="opspilot-staging-api",route="/health",status_code="500"}'
        values: '0+2x400'

      # Latency:
      # 100 requests/minute total
      # 80 requests/minute <=250ms
      # therefore 20% are slow
      # 20% / 1% latency budget = 20x burn
      - series: 'opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route="/health"}'
        values: '0+100x400'

      - series: 'opspilot_http_request_duration_seconds_bucket{job="opspilot-staging-api",route="/health",le="0.25"}'
        values: '0+80x400'

    alert_rule_test:
      - eval_time: 370m
        alertname: OpsPilotAvailabilityBurnRateCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              slo: availability
            exp_annotations:
              summary: "OpsPilot availability error budget is burning rapidly"
              description: "The 99.9% availability SLO is burning faster than 14.4x across both the 1-hour and 5-minute windows."

      - eval_time: 370m
        alertname: OpsPilotAvailabilityBurnRateWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              slo: availability
            exp_annotations:
              summary: "OpsPilot availability error budget burn is elevated"
              description: "The 99.9% availability SLO is burning faster than 6x across both the 6-hour and 30-minute windows."

      - eval_time: 370m
        alertname: OpsPilotLatencyBurnRateCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              slo: latency
            exp_annotations:
              summary: "OpsPilot latency error budget is burning rapidly"
              description: "The 99% under 250ms latency SLO is burning faster than 14.4x across both the 1-hour and 5-minute windows."

      - eval_time: 370m
        alertname: OpsPilotLatencyBurnRateWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              slo: latency
            exp_annotations:
              summary: "OpsPilot latency error budget burn is elevated"
              description: "The 99% under 250ms latency SLO is burning faster than 6x across both the 6-hour and 30-minute windows."
  - name: blackbox-probe-failure
    interval: 1m

    input_series:
      - series: 'probe_success{job="opspilot-staging-blackbox",environment="staging",service="opspilot-api",instance="http://staging.example/health"}'
        values: '0+0x10'

    alert_rule_test:
      - eval_time: 2m
        alertname: OpsPilotBlackboxProbeFailed
        exp_alerts:
          - exp_labels:
              job: opspilot-staging-blackbox
              environment: staging
              service: opspilot-api
              instance: http://staging.example/health
              severity: critical
              monitoring: synthetic
            exp_annotations:
              summary: "OpsPilot staging synthetic probe is failing"
              description: "The external Blackbox probe to the OpsPilot staging API health endpoint has failed for more than 1 minute."

  - name: blackbox-high-latency
    interval: 1m

    input_series:
      - series: 'probe_success{job="opspilot-staging-blackbox",environment="staging",service="opspilot-api",instance="http://staging.example/health"}'
        values: '1+0x10'

      - series: 'probe_duration_seconds{job="opspilot-staging-blackbox",environment="staging",service="opspilot-api",instance="http://staging.example/health"}'
        values: '1.5+0x10'

    alert_rule_test:
      - eval_time: 6m
        alertname: OpsPilotBlackboxHighLatency
        exp_alerts:
          - exp_labels:
              job: opspilot-staging-blackbox
              environment: staging
              service: opspilot-api
              instance: http://staging.example/health
              severity: warning
              monitoring: synthetic
            exp_annotations:
              summary: "OpsPilot staging synthetic probe latency is high"
              description: "The external Blackbox probe to the OpsPilot staging API has exceeded 1 second for more than 5 minutes."
  - name: db-statement-timeout
    interval: 1m

    input_series:
      - series: 'opspilot_db_errors_total{job="opspilot-staging-api",error_type="statement_timeout"}'
        values: '0+1x10'

    alert_rule_test:
      - eval_time: 7m
        alertname: OpsPilotDbStatementTimeout
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              component: database
            exp_annotations:
              summary: "OpsPilot PostgreSQL statement timeout detected"
              description: "At least one PostgreSQL query exceeded the configured statement timeout during the last 5 minutes."

  - name: db-pool-timeout
    interval: 1m

    input_series:
      - series: 'opspilot_db_errors_total{job="opspilot-staging-api",error_type="pool_timeout"}'
        values: '0+1x10'

    alert_rule_test:
      - eval_time: 7m
        alertname: OpsPilotDbPoolTimeout
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              component: database
            exp_annotations:
              summary: "OpsPilot database connection pool exhausted"
              description: "At least one request timed out waiting for a database connection during the last 5 minutes."

  - name: db-connection-error
    interval: 1m

    input_series:
      - series: 'opspilot_db_errors_total{job="opspilot-staging-api",error_type="connection_error"}'
        values: '0+1x10'

    alert_rule_test:
      - eval_time: 7m
        alertname: OpsPilotDbConnectionError
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              component: database
            exp_annotations:
              summary: "OpsPilot database connection errors detected"
              description: "OpsPilot encountered database connection failures during the last 5 minutes."