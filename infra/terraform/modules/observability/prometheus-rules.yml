groups:
  - name: opspilot-staging
    rules:
      - alert: OpsPilotApiDown
        expr: up{job="opspilot-staging-api"} == 0
        for: 1m
        labels:
          severity: critical
          environment: staging
        annotations:
          summary: "OpsPilot staging API is down"
          description: "Prometheus cannot scrape the OpsPilot staging API for more than 1 minute."

      - alert: OpsPilotHigh5xxRate
        expr: |
          100 * (
            (sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics",status_code=~"5.."}[5m])) or vector(0))
            /
            clamp_min(
              sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics"}[5m])),
              0.000001
            )
          ) > 5
        for: 5m
        labels:
          severity: critical
          environment: staging
        annotations:
          summary: "OpsPilot staging 5xx error rate is high"
          description: "The staging API 5xx error rate has exceeded 5% for 5 minutes."

      - alert: OpsPilotHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(opspilot_http_request_duration_seconds_bucket{job="opspilot-staging-api",route!="/metrics"}[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
          environment: staging
        annotations:
          summary: "OpsPilot staging P95 latency is high"
          description: "The staging API P95 request latency has exceeded 1 second for 5 minutes."

      - alert: OpsPilotAvailabilityBurnRateCritical
        expr: |
          (
            (
              (sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics",status_code=~"5.."}[1h])) or vector(0))
              /
              clamp_min(
                sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics"}[1h])),
                0.000001
              )
            ) / 0.001 > 14.4
          )
          and
          (
            (
              (sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics",status_code=~"5.."}[5m])) or vector(0))
              /
              clamp_min(
                sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics"}[5m])),
                0.000001
              )
            ) / 0.001 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          environment: staging
          slo: availability
        annotations:
          summary: "OpsPilot availability error budget is burning rapidly"
          description: "The 99.9% availability SLO is burning faster than 14.4x across both the 1-hour and 5-minute windows."

      - alert: OpsPilotAvailabilityBurnRateWarning
        expr: |
          (
            (
              (sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics",status_code=~"5.."}[6h])) or vector(0))
              /
              clamp_min(
                sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics"}[6h])),
                0.000001
              )
            ) / 0.001 > 6
          )
          and
          (
            (
              (sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics",status_code=~"5.."}[30m])) or vector(0))
              /
              clamp_min(
                sum(rate(opspilot_http_requests_total{job="opspilot-staging-api",route!="/metrics"}[30m])),
                0.000001
              )
            ) / 0.001 > 6
          )
        for: 5m
        labels:
          severity: warning
          environment: staging
          slo: availability
        annotations:
          summary: "OpsPilot availability error budget burn is elevated"
          description: "The 99.9% availability SLO is burning faster than 6x across both the 6-hour and 30-minute windows."

      - alert: OpsPilotLatencyBurnRateCritical
        expr: |
          (
            (
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[1h]))
                -
                sum(rate(opspilot_http_request_duration_seconds_bucket{job="opspilot-staging-api",route!="/metrics",le="0.25"}[1h])),
                0
              )
              /
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[1h])),
                0.000001
              )
            ) / 0.01 > 14.4
          )
          and
          (
            (
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[5m]))
                -
                sum(rate(opspilot_http_request_duration_seconds_bucket{job="opspilot-staging-api",route!="/metrics",le="0.25"}[5m])),
                0
              )
              /
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[5m])),
                0.000001
              )
            ) / 0.01 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          environment: staging
          slo: latency
        annotations:
          summary: "OpsPilot latency error budget is burning rapidly"
          description: "The 99% under 250ms latency SLO is burning faster than 14.4x across both the 1-hour and 5-minute windows."

      - alert: OpsPilotLatencyBurnRateWarning
        expr: |
          (
            (
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[6h]))
                -
                sum(rate(opspilot_http_request_duration_seconds_bucket{job="opspilot-staging-api",route!="/metrics",le="0.25"}[6h])),
                0
              )
              /
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[6h])),
                0.000001
              )
            ) / 0.01 > 6
          )
          and
          (
            (
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[30m]))
                -
                sum(rate(opspilot_http_request_duration_seconds_bucket{job="opspilot-staging-api",route!="/metrics",le="0.25"}[30m])),
                0
              )
              /
              clamp_min(
                sum(rate(opspilot_http_request_duration_seconds_count{job="opspilot-staging-api",route!="/metrics"}[30m])),
                0.000001
              )
            ) / 0.01 > 6
          )
        for: 5m
        labels:
          severity: warning
          environment: staging
          slo: latency
        annotations:
          summary: "OpsPilot latency error budget burn is elevated"
          description: "The 99% under 250ms latency SLO is burning faster than 6x across both the 6-hour and 30-minute windows."

      - alert: OpsPilotBlackboxProbeFailed
        expr: |
          probe_success{
            job="opspilot-staging-blackbox",
            service="opspilot-api"
          } == 0
        for: 1m
        labels:
          severity: critical
          environment: staging
          monitoring: synthetic
        annotations:
          summary: "OpsPilot staging synthetic probe is failing"
          description: "The external Blackbox probe to the OpsPilot staging API health endpoint has failed for more than 1 minute."

      - alert: OpsPilotBlackboxHighLatency
        expr: |
          (
            probe_success{
              job="opspilot-staging-blackbox",
              service="opspilot-api"
            } == 1
          )
          and on(instance, job, environment, service)
          (
            probe_duration_seconds{
              job="opspilot-staging-blackbox",
              service="opspilot-api"
            } > 1
          )
        for: 5m
        labels:
          severity: warning
          environment: staging
          monitoring: synthetic
        annotations:
          summary: "OpsPilot staging synthetic probe latency is high"
          description: "The external Blackbox probe to the OpsPilot staging API has exceeded 1 second for more than 5 minutes."