events {}

http {
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"request_time":$request_time,'
      '"request_id":"$request_id_header","upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';

    map $http_x_request_id $request_id_header {
        default $http_x_request_id;
        ""      $request_id;
    }

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    upstream opspilot_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        location / {
            proxy_pass http://opspilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
