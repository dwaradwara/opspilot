groups:
  - name: opspilot-api-alerts
    rules:
      - alert: OpsPilotAPIDown
        expr: up{job="opspilot-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpsPilot API is down"
          description: "Prometheus has been unable to scrape the OpsPilot API for more than 1 minute."

      - alert: OpsPilotHigh5xxRate
        expr: |
          (
            sum(rate(opspilot_http_requests_total{status_code=~"5..",route!="/metrics"}[5m]))
            /
            clamp_min(
              sum(rate(opspilot_http_requests_total{route!="/metrics"}[5m])),
              0.001
            )
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpsPilot 5xx error rate is high"
          description: "More than 5% of OpsPilot requests are returning 5xx responses."

      - alert: OpsPilotHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(opspilot_http_request_duration_seconds_bucket{route!="/metrics"}[5m])
            )
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpsPilot p95 latency is high"
          description: "OpsPilot p95 request latency has exceeded 500 ms for more than 2 minutes."
      - alert: OpsPilotStagingEndpointDown
        expr: probe_success{job="opspilot-staging-http-probe"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "OpsPilot staging endpoint is unavailable"
          description: "The synthetic HTTP probe against the staging Nginx endpoint has failed for more than 30 seconds."

      - alert: OpsPilotStagingNotReady
        expr: probe_success{job="opspilot-staging-readiness-probe"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "OpsPilot staging is not ready"
          description: "The staging readiness endpoint has failed for more than 30 seconds. One or more required dependencies may be unavailable."

      - alert: OpsPilotOutboxBacklog
        expr: opspilot_outbox_pending_events{job="opspilot-outbox-dispatcher"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpsPilot outbox backlog detected"
          description: "One or more transactional outbox events have remained unpublished for more than 2 minutes."
