groups:
  - name: opspilot-api-alerts
    rules:
      - alert: OpsPilotAPIDown
        expr: up{job="opspilot-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpsPilot API is down"
          description: "Prometheus has been unable to scrape the OpsPilot API for more than 1 minute."

      - alert: OpsPilotHigh5xxRate
        expr: |
          (
            sum(rate(opspilot_http_requests_total{status_code=~"5..",route!="/metrics"}[5m]))
            /
            clamp_min(
              sum(rate(opspilot_http_requests_total{route!="/metrics"}[5m])),
              0.001
            )
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpsPilot 5xx error rate is high"
          description: "More than 5% of OpsPilot requests are returning 5xx responses."

      - alert: OpsPilotHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(opspilot_http_request_duration_seconds_bucket{route!="/metrics"}[5m])
            )
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpsPilot p95 latency is high"
          description: "OpsPilot p95 request latency has exceeded 500 ms for more than 2 minutes."