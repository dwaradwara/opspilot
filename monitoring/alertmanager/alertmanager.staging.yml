global:
  resolve_timeout: 5m

route:
  receiver: opspilot-default
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: opspilot-default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: "#opspilot-alerts"
        send_resolved: true
        title: '[STAGING] {{ .Status }} | {{ .CommonLabels.alertname }}'
        text: |-
          *Severity:* {{ .CommonLabels.severity }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
inhibit_rules:
  # Critical service-health failures suppress generic HTTP symptom alerts.
  - source_matchers:
      - 'alertname=~"OpsPilotAPIDown|OpsPilotStagingEndpointDown|OpsPilotStagingNotReady"'
    target_matchers:
      - 'alertname=~"OpsPilotHigh5xxRate|OpsPilotHighP95Latency"'

  # If the staging endpoint itself is down, readiness failure is redundant.
  - source_matchers:
      - 'alertname="OpsPilotStagingEndpointDown"'
    target_matchers:
      - 'alertname="OpsPilotStagingNotReady"'
