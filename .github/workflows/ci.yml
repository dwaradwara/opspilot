name: OpsPilot CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: opspilot-staging
  ECS_CLUSTER: opspilot-staging-cluster
  ECS_SERVICE: opspilot-staging-api-service
  ECS_CONTAINER: api
  ECS_WORKER_SERVICE: opspilot-staging-worker-service
  ECS_WORKER_CONTAINER: worker
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/infra/terraform/modules/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/prometheus-rules.yml

          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/infra/terraform/modules/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            test rules /etc/prometheus/prometheus-rules.test.yml

      - name: Run isolated test suite
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from api_test

      - name: Clean up test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    concurrency:
      group: opspilot-staging-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: opspilot-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check whether immutable image already exists
        id: image-check
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; skipping push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push immutable image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "$AWS_REGION"

      - name: Read current ECS task definition
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --region "$AWS_REGION" \
            --query "taskDefinition" \
            > task-definition.json

      - name: Read current worker ECS task definition
        run: |
          CURRENT_WORKER_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_WORKER_TASK_DEF" \
            --region "$AWS_REGION" \
            --query "taskDefinition" \
            > worker-task-definition.json
      - name: Create task definition with new image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          jq \
            --arg IMAGE_URI "$IMAGE_URI" \
            --arg CONTAINER_NAME "$ECS_CONTAINER" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER_NAME
              then .image = $IMAGE_URI
              else .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
            ' task-definition.json > task-definition-new.json

      - name: Create worker task definition with new image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          jq \
            --arg IMAGE_URI "$IMAGE_URI" \
            --arg CONTAINER_NAME "$ECS_WORKER_CONTAINER" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER_NAME
              then .image = $IMAGE_URI
              else .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
            ' worker-task-definition.json > worker-task-definition-new.json
      - name: Register new ECS task definition
        id: register-task
        run: |
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --region "$AWS_REGION" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition=$NEW_TASK_DEF" >> "$GITHUB_OUTPUT"
          echo "Registered $NEW_TASK_DEF"

      - name: Register new worker ECS task definition
        id: register-worker-task
        run: |
          NEW_WORKER_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://worker-task-definition-new.json \
            --region "$AWS_REGION" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition=$NEW_WORKER_TASK_DEF" >> "$GITHUB_OUTPUT"
          echo "Registered worker $NEW_WORKER_TASK_DEF"
      - name: Run staging database migrations
        env:
          MIGRATION_TASK_DEF: ${{ steps.register-task.outputs.task_definition }}
        run: |
          NETWORK_CONFIGURATION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].networkConfiguration" \
            --output json)

          MIGRATION_OVERRIDES='{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}'

          RUN_RESULT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATION_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides "$MIGRATION_OVERRIDES" \
            --region "$AWS_REGION")

          echo "$RUN_RESULT" | jq .

          FAILURE_COUNT=$(echo "$RUN_RESULT" | jq '.failures | length')

          if [ "$FAILURE_COUNT" -ne 0 ]; then
            echo "Migration task failed to start."
            exit 1
          fi

          MIGRATION_TASK_ARN=$(echo "$RUN_RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$MIGRATION_TASK_ARN" ]; then
            echo "Migration task ARN was not returned."
            exit 1
          fi

          echo "Migration task: $MIGRATION_TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --region "$AWS_REGION"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --region "$AWS_REGION" \
            --query "tasks[0].containers[?name=='api'] | [0].exitCode" \
            --output text)

          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --region "$AWS_REGION" \
            --query "tasks[0].stoppedReason" \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          echo "Migration stopped reason: $STOPPED_REASON"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed. Staging deployment will not proceed."
            exit 1
          fi

          echo "Database migration completed successfully."

      - name: Deploy task definition to staging
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task_definition }}" \
            --region "$AWS_REGION"

      - name: Deploy worker task definition to staging
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "${{ steps.register-worker-task.outputs.task_definition }}" \
            --region "$AWS_REGION"
      - name: Wait for staging services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify deployed task definitions
        run: |
          DEPLOYED_API_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          DEPLOYED_WORKER_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          EXPECTED_API_TASK_DEF="${{ steps.register-task.outputs.task_definition }}"
          EXPECTED_WORKER_TASK_DEF="${{ steps.register-worker-task.outputs.task_definition }}"

          echo "Expected API: $EXPECTED_API_TASK_DEF"
          echo "Deployed API: $DEPLOYED_API_TASK_DEF"
          echo "Expected worker: $EXPECTED_WORKER_TASK_DEF"
          echo "Deployed worker: $DEPLOYED_WORKER_TASK_DEF"

          if [ "$DEPLOYED_API_TASK_DEF" != "$EXPECTED_API_TASK_DEF" ]; then
            echo "API deployment did not remain on the new task definition."
            exit 1
          fi

          if [ "$DEPLOYED_WORKER_TASK_DEF" != "$EXPECTED_WORKER_TASK_DEF" ]; then
            echo "Worker deployment did not remain on the new task definition."
            exit 1
          fi
      - name: Run external staging health smoke test
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names opspilot-staging-alb \
            --region "$AWS_REGION" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          HEALTH_URL="http://${ALB_DNS}/health"

          echo "Testing $HEALTH_URL"

          for attempt in {1..6}; do
            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "$HEALTH_URL") && {
                echo "Response: $RESPONSE"

                echo "$RESPONSE" | jq -e '
                  .status == "healthy"
                  and .service == "opspilot-api"
                ' >/dev/null && {
                  echo "External staging health check passed."
                  exit 0
                }
              }

            echo "Health check attempt $attempt failed."

            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done

          echo "External staging health check failed."
          exit 1
      - name: Record immutable image
        run: |
          echo "### OpsPilot staging image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
