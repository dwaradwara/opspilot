name: OpsPilot CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: opspilot-staging
  ECS_CLUSTER: opspilot-staging-cluster
  ECS_SERVICE: opspilot-staging-api-service
  ECS_CONTAINER: api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run isolated test suite
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from api_test

      - name: Clean up test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: opspilot-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check whether immutable image already exists
        id: image-check
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; skipping push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push immutable image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "$AWS_REGION"

      - name: Read current ECS task definition
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --region "$AWS_REGION" \
            --query "taskDefinition" \
            > task-definition.json

      - name: Create task definition with new image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          jq \
            --arg IMAGE_URI "$IMAGE_URI" \
            --arg CONTAINER_NAME "$ECS_CONTAINER" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER_NAME
              then .image = $IMAGE_URI
              else .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
            ' task-definition.json > task-definition-new.json

      - name: Register new ECS task definition
        id: register-task
        run: |
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --region "$AWS_REGION" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition=$NEW_TASK_DEF" >> "$GITHUB_OUTPUT"
          echo "Registered $NEW_TASK_DEF"

      - name: Deploy task definition to staging
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task_definition }}" \
            --region "$AWS_REGION"

      - name: Wait for staging service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify deployed task definition
        run: |
          DEPLOYED_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          EXPECTED_TASK_DEF="${{ steps.register-task.outputs.task_definition }}"

          echo "Expected: $EXPECTED_TASK_DEF"
          echo "Deployed: $DEPLOYED_TASK_DEF"

          if [ "$DEPLOYED_TASK_DEF" != "$EXPECTED_TASK_DEF" ]; then
            echo "Deployment did not remain on the new task definition."
            exit 1
          fi

      - name: Record immutable image
        run: |
          echo "### OpsPilot staging image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
