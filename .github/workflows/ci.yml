name: OpsPilot CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run isolated test suite
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from api_test

      - name: Clean up test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  publish-image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish-image
    runs-on: [self-hosted, Windows, X64, opspilot-staging]
    timeout-minutes: 10

    concurrency:
      group: opspilot-staging
      cancel-in-progress: false

    steps:
      - name: Deploy immutable image to staging
        shell: powershell
        working-directory: 'D:\project ops\opspilot-phase1'
        env:
          OPSPILOT_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $localSha = git rev-parse HEAD

          if ($localSha -ne $env:EXPECTED_SHA) {
            throw "Local staging checkout is $localSha but deployment expects $env:EXPECTED_SHA"
          }

          docker pull $env:OPSPILOT_IMAGE

          docker compose --env-file .env.staging -f docker-compose.staging.yml up -d `
            --no-build `
            --force-recreate `
            api worker outbox-dispatcher

          docker compose --env-file .env.staging -f docker-compose.staging.yml restart nginx

      - name: Verify staging health
        shell: powershell
        working-directory: 'D:\project ops\opspilot-phase1'
        run: |
          $healthy = $false

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -UseBasicParsing `
                -Uri "http://localhost:18080/health" `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $healthy) {
            docker compose --env-file .env.staging -f docker-compose.staging.yml ps
            throw "Staging health check failed"
          }

          $ready = Invoke-RestMethod `
            -Uri "http://localhost:18080/ready" `
            -TimeoutSec 5

          if (
            $ready.status -ne "ready" -or
            -not $ready.checks.postgres -or
            -not $ready.checks.redis
          ) {
            throw "Staging readiness check failed"
          }

          Write-Host "Staging deployment verified successfully."

      - name: Show staging status
        if: always()
        shell: powershell
        working-directory: 'D:\project ops\opspilot-phase1'
        run: |
          docker compose --env-file .env.staging -f docker-compose.staging.yml ps