name: opspilot-staging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${OPSPILOT_IMAGE:-opspilot:staging-local}
    build: .
    env_file: .env.staging
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: ${OPSPILOT_IMAGE:-opspilot:staging-local}
    build: .
    env_file: .env.staging
    command: ["python", "-m", "worker.main"]
    depends_on:
      redis:
        condition: service_healthy

  outbox-dispatcher:
    image: ${OPSPILOT_IMAGE:-opspilot:staging-local}
    build: .
    env_file: .env.staging
    command: ["python", "-m", "app.services.outbox_dispatcher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/alerts.staging.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/slo.staging.yml:/etc/prometheus/slo.yml:ro
      - ./monitoring/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.staging.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/secrets/slack-webhook-url:/etc/alertmanager/secrets/slack-webhook-url:ro
      - alertmanager_data:/alertmanager

  loki:
    image: grafana/loki:3.5.0
    command:
      - "-config.file=/etc/loki/loki.yml"
    ports:
      - "13100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
  alloy:
    image: grafana/alloy:latest
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
  tempo:
    image: grafana/tempo:2.10.7
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "13200:3200"
      - "14317:4317"
      - "14318:4318"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "13000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - "--config.file=/etc/blackbox_exporter/blackbox.yml"
    ports:
      - "19115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    depends_on:
      - nginx

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  tempo_data:
